name: Deploying project
on:
    push:
        branches: [main, release, develop]
    pull_request:
        branches: [main, release, develop]
    workflow_dispatch:
    
jobs:
    Build_Job:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
        env:
            job_name: Build_Job
            IMAGE_TAG_BACK: ${{secrets.PACKAGE_LINK}}/backend:latest
            backend_container: hsmg_web_new-backend
            frontend_container: hsmg_web_new-frontend
        steps:
            - uses: actions/checkout@v4
            - name: Login ghcr.io
              run: |
                echo ${{ secrets.PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            - name: Build docker images
              run: |
                docker compose build
            - name: Push docker images
              run: |
                docker images
                docker tag $backend_container ${{ env.IMAGE_TAG_BACK }}
                docker push ${{ env.IMAGE_TAG_BACK }}
            - name: Verify push manually
              run: |
                docker pull ${{ env.IMAGE_TAG_BACK }} || echo "Image backend not available for pull"
    Deploy_Job:
        runs-on: ubuntu-latest
        needs: Build_Job
        env:
            job_name: Deploy_Job
        steps:
            - uses: actions/checkout@v4
            - name: Setup ssh
              run: |
                mkdir -p ~/.ssh
                touch ~/.ssh/id_rsa
                echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
                chmod 600 ~/.ssh/id_rsa
            - name: Connect SSH to server and setup
              run: |
                echo "${{secrets.SSH_USER}}@${{secrets.SSH_HOST}}"
                ssh -o StrictHostKeyChecking=no ${{secrets.SSH_USER}}@${{secrets.SSH_HOST}} "
                    mkdir -p ~/app
                    cd ~/app
                    touch .env
                    echo "PACKAGE_LINK=${{secrets.PACKAGE_LINK}}" > .env
                "
                scp -o StrictHostKeyChecking=no docker-compose-deploy.yaml ${{secrets.SSH_USER}}@${{secrets.SSH_HOST}}:~/app/
            - name: Deploy on server
              run: |
                ssh -o StrictHostKeyChecking=no ${{secrets.SSH_USER}}@${{secrets.SSH_HOST}} "
                    cd ~/app
                    echo ${{ secrets.PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
                    docker compose -f docker-compose-deploy.yaml down
                    docker compose -f docker-compose-deploy.yaml pull
                    docker compose -f docker-compose-deploy.yaml up -d
                "
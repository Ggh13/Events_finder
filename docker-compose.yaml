  #  depends_on:
  #    backend:
  #      condition: service_started
  #  container_name: classifier
  #  build: 
  #    context: ./ml_classifier
  #    dockerfile: ./docker/Dockerfile
  #  deploy:
  #    resources:
  #      limits:
  #        cpus: '1'   # Limit to 0.5 of a CPU core
  #        memory: 3072M    # Limit memory to 50 Megabytes
  #      reservations:
  #        cpus: '1'   # Guarantee at least 0.25 of a CPU core
  #        memory: 3072M    # Guarantee at least 20 Megabytes of memory
  #  networks:
  #    - app-network
  bot:
    depends_on:
      backend:
        condition: service_started
    container_name: bot
    build: 
      context: ./bot
      dockerfile: ./docker/Dockerfile
    networks:
      - app-network
  backend:
    depends_on:
      postgres:
        condition: service_healthy
    container_name: backend
    build:
      context: ./backend
      dockerfile: ./docker/Dockerfile
    networks:
      - app-network
  recommender_system:
    depends_on:
      backend:
        condition: service_started
    container_name: recommender_system
    build:
      context: ./recommender_system
      dockerfile: ./docker/Dockerfile
    networks:
      - app-network
  postgres:
    container_name: postgres_events
    image: postgres:latest
    environment:
      POSTGRES_HOST: postgres #127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
      PGDATA: /data/postgres
    volumes:
       - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
  redis:
    image: redis:latest # Use the latest official Redis image
    container_name: redis # Optional: Assign a custom container name
    restart: unless-stopped # Restart the container automatically unless explicitly stopped
    volumes:
      - redis_data:/data # Persist Redis data to a named volume
    environment:
      # Optional: Set a password for Redis authentication
      - REDIS_PASSWORD=your_secure_password 
    networks:
      - app-network
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./static:/var/www/static
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf 
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:

networks:
  app-network:
    driver: bridge

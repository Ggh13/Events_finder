version: '3.5'

services:
  backend:
    depends_on:
      postgres:
        condition: service_healthy
    container_name: backend
    build:
      context: ./backend
      dockerfile: ./docker/Dockerfile
    ports:
        - "8080:8080"
    networks:
      - app-network
  postgres:
    container_name: postgres_events
    image: postgres:latest
    environment:
      POSTGRES_HOST: postgres #127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
      PGDATA: /data/postgres
    volumes:
       - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
  redis:
    image: redis:latest # Use the latest official Redis image
    container_name: redis # Optional: Assign a custom container name
    restart: unless-stopped # Restart the container automatically unless explicitly stopped
    ports:
      - "6379:6379" # Map host port 6379 to container port 6379
    volumes:
      - redis_data:/data # Persist Redis data to a named volume
    environment:
      # Optional: Set a password for Redis authentication
      - REDIS_PASSWORD=your_secure_password 
    networks:
      - app-network
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./static:/var/www/static
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf 
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:

networks:
  app-network:
    driver: bridge

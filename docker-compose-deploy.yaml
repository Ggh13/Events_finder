version: '3.5'

services:
  backend:
    depends_on:
        postgres:
          condition: service_healthy
    build: .
    image: ${PACKAGE_LINK}/backend:latest
    networks:
      - app-network
  bot:
    depends_on:
        postgres:
          condition: service_healthy
    build: .
    image: ${PACKAGE_LINK}/bot:latest
    networks:
      - app-network
  recommender_system:
    depends_on:
        postgres:
          condition: service_healthy
    build: .
    image: ${PACKAGE_LINK}/recommender_system:latest
    networks:
      - app-network
  ml_classifier:
    depends_on:
        postgres:
          condition: service_healthy
    build: .
    image: ${PACKAGE_LINK}/ml_classifier:latest
    networks:
      - app-network
  postgres:
    container_name: postgres_events
    image: postgres:latest
    environment:
      POSTGRES_HOST: postgres #127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
      PGDATA: /data/postgres
    volumes:
       - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
  redis:
    image: redis:latest # Use the latest official Redis image
    container_name: redis # Optional: Assign a custom container name
    restart: unless-stopped # Restart the container automatically unless explicitly stopped
    volumes:
      - redis_data:/data # Persist Redis data to a named volume
    environment:
      # Optional: Set a password for Redis authentication
      - REDIS_PASSWORD=your_secure_password
    networks:
      - app-network
  nginx:
    build: .
    image: ${PACKAGE_LINK}/nginx:latest
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./static:/var/www/static
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:

networks:
  app-network:
    driver: bridge
